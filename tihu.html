<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f0">
  <meta name="description" content="和一只鹈鹕一起骑慢一点。一个用 SVG 绘制的、适合在手机上欣赏的海岸骑行小动画。">
  <title>慢慢骑 · 鹈鹕的兜风日记</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f6f0;
      --ink: #30483d;
      --muted: #899087;
      --orange: #d98258;
      --line: #e2e4d9;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid #d98258; outline-offset: 5px; }
    button { cursor: pointer; }
    button, a { touch-action: manipulation; }
    button:disabled { cursor: default; }
    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { display: block; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .shell { width: min(1120px, calc(100% - 80px)); margin-inline: auto; }
    .site-header { height: 98px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 45px; height: 45px; }
    .brand-name { font-size: 21px; font-weight: 650; letter-spacing: 3px; }
    .brand-english { display: block; margin-top: 4px; color: #869085; font-size: 8px; letter-spacing: 2.3px; }
    .header-note { display: flex; align-items: center; gap: 10px; color: #7a8579; font-size: 12px; letter-spacing: 1px; }
    .header-note .icon { width: 23px; height: 23px; }
    .hero { padding: 37px 0 32px; text-align: center; }
    .eyebrow { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 0 0 15px; font-size: 9px; font-weight: 500; letter-spacing: 2.8px; color: #84917f; }
    .eyebrow::before { content: ""; width: 18px; height: 1px; background: #a5af9a; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", "Noto Serif CJK SC", ui-serif, serif; font-size: clamp(32px, 3.8vw, 49px); font-weight: 600; letter-spacing: 2px; line-height: 1.4; }
    .highlight { position: relative; display: inline-block; color: var(--orange); }
    .highlight svg { position: absolute; bottom: -3px; left: 0; width: 100%; height: 10px; fill: none; stroke: #d9825866; stroke-width: 2; }
    .intro { margin: 17px 0 0; color: #858a80; font-size: 12px; letter-spacing: 1.8px; line-height: 1.8; }

    .ride-card { overflow: hidden; border: 1px solid #dee3d7; border-radius: 24px; background: #fafbf6; box-shadow: 0 10px 32px #3e573107; }
    .scene {
      --sky-top: #e9f0e8;
      --sky-bottom: #f4f3df;
      --sun: #efc78b;
      --sea: #ccdeda;
      --wave: #edf4e8;
      --hill: #adc4b5;
      --far-hill: #c6d4be;
      --grass: #d8dfbd;
      --road: #eee8d4;
      position: relative;
      isolation: isolate;
      aspect-ratio: 2.22;
      overflow: hidden;
      background: var(--sky-top);
    }
    .scene[data-scene="forest"] { --sky-top: #e4edde; --sky-bottom: #f1f0d6; --sun: #e3ce8e; --grass: #cdd9b1; --road: #e9e3c9; }
    .scene[data-scene="sunset"] { --sky-top: #eddacf; --sky-bottom: #f6e8ce; --sun: #e5a070; --sea: #decfc1; --wave: #f5e6d3; --hill: #aaaeb0; --far-hill: #c5c4b8; --grass: #d3d2b5; --road: #e9ddc6; }
    .scene-art { display: block; width: 100%; height: 100%; }
    .landscape { display: none; }
    [data-scene="coast"] .landscape--coast, [data-scene="sunset"] .landscape--coast, [data-scene="forest"] .landscape--forest { display: inline; }
    .scene-top { position: absolute; z-index: 1; top: 25px; left: 27px; right: 27px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
    .scene-label { display: flex; align-items: center; gap: 8px; padding: 9px 13px; background: #fffff88c; border: 1px solid #fffff887; border-radius: 30px; font-size: 11px; letter-spacing: 1px; }
    .status-dot { width: 6px; height: 6px; background: #799677; border-radius: 50%; box-shadow: 0 0 0 3px #7f997515; }
    .is-paused .status-dot { background: #c4a377; }
    .scene-edition { color: #7e8d7b; font-size: 9px; letter-spacing: 2px; }
    .scene-bottom { position: absolute; bottom: 21px; left: 28px; right: 24px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
    .scene-caption { display: flex; align-items: center; gap: 9px; color: #7d8873; font-size: 10px; letter-spacing: 1px; }
    .scene-caption .icon { width: 16px; height: 16px; }
    .bell-button { pointer-events: auto; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 1px solid #ffffffa8; border-radius: 50%; background: #fffef5a8; color: #62715b; transition: background .2s, transform .2s; }
    .bell-button:hover { background: #fffdf2; transform: rotate(-8deg); }
    .bell-button:active { transform: scale(.92); }
    .bell-button .icon { width: 18px; height: 18px; }
    .bell-hint { position: absolute; z-index: 2; left: 50%; bottom: 24px; width: max-content; max-width: calc(100% - 100px); padding: 10px 16px; transform: translate(-50%, 6px); border-radius: 30px; background: #fffdf4ed; box-shadow: 0 3px 18px #53663c0b; color: #6f7c63; text-align: center; font-size: 11px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
    .bell-hint.is-visible { opacity: 1; transform: translate(-50%, 0); }

    .controls { min-height: 102px; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 21px 29px; background: #fcfcf7; border-top: 1px solid #e1e5d7; }
    .play-control { display: flex; align-items: center; gap: 13px; min-width: 169px; }
    .play-button { display: grid; place-items: center; width: 47px; height: 47px; flex-shrink: 0; border: none; border-radius: 50%; color: #f7f6ed; background: var(--ink); transition: background .2s, transform .2s; }
    .play-button:hover { background: #49614c; transform: scale(1.04); }
    .play-button:active { transform: scale(.96); }
    .play-button .icon { width: 19px; height: 19px; }
    .control-title { display: block; font-size: 12px; font-weight: 500; letter-spacing: 1px; }
    .control-caption { display: block; margin-top: 7px; color: #989d91; font-size: 10px; letter-spacing: .5px; }
    .speed-control { display: flex; align-items: center; gap: 16px; }
    .control-label { color: #8c9385; font-size: 10px; letter-spacing: 1px; }
    .speed-options { display: flex; align-items: center; gap: 4px; padding: 5px; border: 1px solid #e5e8dc; border-radius: 12px; background: #f0f2e9; }
    .speed-button { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: #8c9383; font-size: 11px; transition: background .2s, color .2s, box-shadow .2s; }
    .speed-button .icon { width: 17px; height: 17px; }
    .speed-button[aria-pressed="true"] { background: #fffef9; border-color: #e1e5d6; color: var(--ink); box-shadow: 0 2px 5px #334b3010; }
    .speed-button:hover { color: var(--ink); }
    .scene-control { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 45px; padding: 0 15px; border: 1px solid #dfe5d7; border-radius: 10px; background: transparent; font-size: 11px; letter-spacing: 1px; transition: background .2s; }
    .scene-control:hover { background: #f0f2e9; }
    .scene-control > .icon:first-child { width: 18px; height: 18px; }
    .scene-control > .icon:last-child { width: 14px; height: 14px; color: #89947f; }
    .afterword { display: flex; align-items: center; justify-content: center; gap: 17px; padding: 24px 0 27px; color: #929887; font-size: 11px; letter-spacing: 1.3px; }
    .afterword::before, .afterword::after { content: ""; width: 33px; height: 1px; background: #dce1d0; }
    .afterword span { color: #b5bba8; padding: 0 5px; }
    .site-footer { display: flex; align-items: center; justify-content: space-between; padding: 19px 0 24px; border-top: 1px solid var(--line); color: #969b90; font-size: 9px; letter-spacing: 1px; }
    .footer-note { display: flex; align-items: center; gap: 6px; }
    .footer-note .icon { width: 12px; height: 12px; color: #c18d70; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    noscript p { padding: 0 20px; text-align: center; color: #7e8879; font-size: 12px; }

    @media (min-width: 1600px) {
      .shell { width: min(1200px, calc(100% - 120px)); }
      .hero { padding-top: 46px; padding-bottom: 39px; }
      .scene { aspect-ratio: 2.18; }
    }

    @media (max-width: 950px) {
      .shell { width: calc(100% - 48px); }
      .controls { gap: 15px; padding-inline: 22px; }
      .speed-control { gap: 0; }
      .control-label { display: none; }
      .speed-button { padding-inline: 10px; }
      .play-control { min-width: 146px; }
      .scene { aspect-ratio: 1.85; }
    }

    @media (max-width: 680px) {
      .shell { width: calc(100% - 36px); }
      .site-header { height: 78px; }
      .brand { gap: 9px; }
      .brand-mark { width: 38px; height: 38px; }
      .brand-name { font-size: 18px; }
      .brand-english { font-size: 7px; letter-spacing: 1.8px; }
      .header-note { font-size: 10px; letter-spacing: 0; gap: 6px; }
      .header-note .icon { width: 19px; height: 19px; }
      .hero { padding: 31px 0 27px; }
      .eyebrow { font-size: 8px; letter-spacing: 2px; margin-bottom: 13px; }
      h1 { font-size: clamp(27px, 7.1vw, 39px); letter-spacing: .7px; }
      .intro { font-size: 10px; margin-top: 15px; letter-spacing: 1px; }
      .ride-card { border-radius: 19px; }
      .scene { aspect-ratio: .98; max-height: 500px; }
      #sun { transform: translate(-142px, 6px); }
      .scene-top { top: 18px; left: 17px; right: 17px; }
      .scene-label { font-size: 10px; padding: 8px 10px; gap: 7px; }
      .scene-edition { font-size: 8px; letter-spacing: 1px; }
      .scene-bottom { bottom: 15px; left: 17px; right: 15px; }
      .scene-caption { font-size: 8px; letter-spacing: .5px; gap: 6px; }
      .bell-button { width: 36px; height: 36px; }
      .bell-hint { bottom: 59px; max-width: calc(100% - 30px); font-size: 10px; }
      .controls { display: grid; grid-template-columns: 1fr auto; gap: 19px 10px; padding: 20px 18px 19px; }
      .play-control { gap: 10px; min-width: 0; }
      .play-button { width: 43px; height: 43px; }
      .control-title { font-size: 11px; }
      .control-caption { font-size: 9px; margin-top: 6px; }
      .scene-control { grid-column: 2; grid-row: 1; font-size: 10px; padding-inline: 11px; gap: 7px; min-height: 41px; }
      .speed-control { grid-column: 1 / -1; grid-row: 2; }
      .speed-options { width: 100%; gap: 3px; }
      .speed-button { flex: 1; min-height: 40px; padding-inline: 5px; font-size: 10px; }
      .afterword { padding: 23px 0; gap: 10px; font-size: 9px; letter-spacing: .8px; }
      .afterword::before, .afterword::after { width: 21px; }
      .site-footer { padding-top: 17px; padding-bottom: max(23px, env(safe-area-inset-bottom)); font-size: 8px; letter-spacing: .3px; }
      .footer-note { gap: 4px; }
    }

    @media (max-width: 360px) {
      .shell { width: calc(100% - 24px); }
      .header-note span { display: none; }
      .controls { padding-inline: 13px; }
      .scene-edition { display: none; }
      .scene-control { padding-inline: 9px; }
      .site-footer { font-size: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="icon-wind" viewBox="0 0 24 24"><path d="M3 8h12a3 3 0 1 0-3-3M2 12h17a3 3 0 1 1-3 3M5 16h5a3 3 0 1 1-3 3"/></symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 6v12M16 6v12" stroke-width="3"/></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="icon-leaf" viewBox="0 0 24 24"><path d="M19 4C10 2 3 7 5 15c7 6 15 0 14-11ZM4 21 15 10M10 15v-5"/></symbol>
      <symbol id="icon-bike" viewBox="0 0 24 24"><circle cx="5" cy="16" r="4"/><circle cx="19" cy="16" r="4"/><path d="m5 16 5-9 5 9H5l4-7h8M8 6h4M16 4h2l2 12"/></symbol>
      <symbol id="icon-landscape" viewBox="0 0 24 24"><path d="m2 19 7-11 5 7 3-5 5 9ZM7 11l2 2 2-2"/><circle cx="17" cy="5" r="2"/></symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
      <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5ZM10 20h4M12 2v2M3 7l-1 4m19-4 1 4"/></symbol>
      <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M12 20 4 12C-2 5 7-1 12 6c5-7 14-1 8 6Z"/></symbol>
    </defs>
  </svg>

  <header class="site-header shell">
    <div class="brand" aria-label="慢慢骑，Slow and easy">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="46" height="46" rx="15" fill="#e9eddf"/>
        <g stroke="#526a52" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="13" cy="33" r="6"/><circle cx="35" cy="33" r="6"/>
          <path d="m13 33 8-12 6 12H13l7-9h12l3 9M19 20h5M31 21l-1-3h4"/>
          <path d="M17 20c-6-3-4-9 2-8 2 1 3 2 5 2 2 0 2-2 2-5a4 4 0 0 1 8 0l-1 5c-2 4-7 8-13 6" fill="#f7f6e9"/>
          <path d="m33 10 9 3-10 1" fill="#dfaa69" stroke="#c5965b"/>
        </g>
        <circle cx="31" cy="8" r="1" fill="#30483d"/>
      </svg>
      <div><span class="brand-name">慢慢骑</span><span class="brand-english">SLOW & EASY</span></div>
    </div>
    <div class="header-note"><svg class="icon" aria-hidden="true"><use href="#icon-wind"/></svg><span>生活不必总是全速前进</span></div>
  </header>

  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">A LITTLE RIDE, A LITTLE JOY</p>
      <h1 id="page-title">把日子，骑<span class="highlight">慢一点<svg viewBox="0 0 150 10" preserveAspectRatio="none" aria-hidden="true"><path d="M3 6Q69 0 146 5M18 9Q83 4 130 8"/></svg></span>。</h1>
      <p class="intro">没有目的地也没关系。和鹈鹕一起，让心情兜个风。</p>
    </section>

    <section class="ride-card" aria-label="鹈鹕的兜风日记">
      <div class="scene" id="scene" data-scene="coast">
        <div class="scene-top">
          <div class="scene-label"><span class="status-dot" aria-hidden="true"></span><span id="scene-name">海岸漫游</span></div>
          <span class="scene-edition" id="scene-edition">DAYDREAM Nº 01</span>
        </div>

        <svg class="scene-art" id="ride-art" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="art-title art-description" xmlns="http://www.w3.org/2000/svg">
          <title id="art-title">一只骑着自行车兜风的鹈鹕</title>
          <desc id="art-description">白色鹈鹕戴着橘红色围巾，骑着珊瑚色自行车沿海岸前进。长长的金色嘴喙迎着风，车篮里的小花轻轻摇摆，双脚交替踩动踏板，车轮不停转动。</desc>
          <defs>
            <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="var(--sky-top)"/><stop offset="1" stop-color="var(--sky-bottom)"/></linearGradient>
            <linearGradient id="pelican-feathers" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffef3"/><stop offset="1" stop-color="#e8eadb"/></linearGradient>
            <linearGradient id="bill-pouch" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#edbc77"/><stop offset="1" stop-color="#dba064"/></linearGradient>
            <pattern id="road-marks" patternUnits="userSpaceOnUse" width="155" height="12"><path d="M15 6h51" stroke="#fbf8e8" stroke-width="3" stroke-linecap="round"/></pattern>
            <pattern id="basket-weave" patternUnits="userSpaceOnUse" width="9" height="9"><path d="M0 2h9M3 0v9" stroke="#ae8a5e" stroke-width="1" opacity=".48"/></pattern>
            <g id="cloud-shape" fill="#fcfbee"><path d="M0 24C4 11 16 10 25 15 27-4 53-5 60 12 70 5 85 12 85 22c12-1 19 5 20 11H-9c0-5 4-9 9-9Z"/></g>
            <g id="pine"><path d="M0 0v105" stroke="#839a78" stroke-width="4"/><path d="m0-6-27 50h15l-26 36h76L12 44h15Z" fill="currentColor"/></g>
            <g id="grass-tuft" fill="none" stroke="#9cab7d" stroke-width="2" stroke-linecap="round"><path d="M0 0q-1-9-6-14M1 0q0-14 5-20M4 0q3-7 8-10"/></g>
            <g id="ground-tile"><use href="#grass-tuft" x="28" y="522"/><use href="#grass-tuft" x="220" y="589" transform="translate(66 176) scale(.7)"/><path d="M112 581h12M206 523h9" stroke="#b8bc96" stroke-width="2" stroke-linecap="round"/><ellipse cx="272" cy="585" rx="5" ry="2.2" fill="#b7bd98"/></g>
            <g id="daisy"><g fill="#fffbee"><ellipse cy="-7" rx="3" ry="6"/><ellipse cy="7" rx="3" ry="6"/><ellipse cx="7" rx="6" ry="3"/><ellipse cx="-7" rx="6" ry="3"/><ellipse rx="3" ry="6" transform="rotate(45) translate(0 -7)"/><ellipse rx="3" ry="6" transform="rotate(-45) translate(0 -7)"/><ellipse rx="3" ry="6" transform="rotate(45) translate(0 7)"/><ellipse rx="3" ry="6" transform="rotate(-45) translate(0 7)"/></g><circle r="4" fill="#dbaa52"/></g>
            <g id="spoke-lines" stroke="#8b9d8a" stroke-width="1.35" opacity=".75"><path d="M-74 0H74M0-74V74M-64-37 64 37M-37-64 37 64M-64 37 64-37M-37 64 37-64"/></g>
          </defs>

          <path fill="url(#sky)" d="M0 0h1200v600H0Z"/>
          <g id="sun"><circle cx="936" cy="141" r="63" fill="var(--sun)" opacity=".11"/><circle cx="936" cy="141" r="47" fill="var(--sun)" opacity=".77"/></g>
          <g id="far-clouds" opacity=".72"><use href="#cloud-shape" transform="translate(142 128) scale(1.25 .8)"/><use href="#cloud-shape" transform="translate(838 220) scale(.8 .6)"/><use href="#cloud-shape" transform="translate(1342 128) scale(1.25 .8)"/><use href="#cloud-shape" transform="translate(2038 220) scale(.8 .6)"/></g>
          <g id="near-clouds" opacity=".87"><use href="#cloud-shape" transform="translate(-96 108) scale(1.15 .8)"/><use href="#cloud-shape" transform="translate(360 82) scale(.8 .6)"/><use href="#cloud-shape" transform="translate(1104 108) scale(1.15 .8)"/><use href="#cloud-shape" transform="translate(1560 82) scale(.8 .6)"/><use href="#cloud-shape" transform="translate(2304 108) scale(1.15 .8)"/></g>
          <g id="distant-birds" fill="none" stroke="#879e8c" stroke-width="2" stroke-linecap="round" opacity=".6"><path d="M811 163q8-7 16 0 8-7 16-3M862 186q6-5 12 0 6-5 12-2M240 236q8-6 15 0 6-6 13-2"/></g>

          <g class="landscape landscape--coast">
            <path d="M0 355Q138 307 263 349T491 365L491 407H0Z" fill="var(--far-hill)"/>
            <path d="M0 371Q158 350 292 371T612 371H1200V535H0Z" fill="var(--sea)"/>
            <path d="M815 378c50-25 71-57 133-59 51-2 88 13 128-4 40-18 83-43 124-36v125c-124 0-252-8-385-26Z" fill="var(--hill)"/>
            <path d="M868 377c84-4 113 12 182 8 54-3 101-1 150 10v11c-100-5-218-5-332-29Z" fill="var(--wave)" opacity=".7"/>
            <g id="sea-lines" fill="none" stroke="var(--wave)" stroke-linecap="round"><path d="M-60 398H64m38 0h24m105 25h125m-158 28h50m516-45h74m64 26h122m-39 34h40M411 389h65m527 10h82M14 484h126m886 11h107M478 480h91" stroke-width="2"/><path d="M58 419h90m213 38h95m453 24h88M655 429h60m416 20h120" stroke-width="1.2" opacity=".75"/></g>
            <g transform="translate(194 354)" opacity=".75"><path d="M0 17h35l-6 5H7Z" fill="#819e91"/><path d="M18-19V15H1Z" fill="#fff9e8"/><path d="M21-11v26h12Z" fill="#e6b795"/></g>
            <g transform="translate(1019 279)"><path d="m-7 30 3-40h12l4 40Z" fill="#f6f1df"/><path d="M-4-10h12v-7H-4Z" fill="#668779"/><path d="m-6-17 8-8 8 8Z" fill="#c48a68"/><path d="M1-8v7" stroke="#739083" stroke-width="2"/></g>
          </g>

  <footer class="site-footer shell"><span>鹈鹕的兜风日记 / VOL. 001</span><span class="footer-note">纯 SVG 绘制<svg class="icon" aria-hidden="true"><use href="#icon-heart"/></svg>为一点点快乐而做</span></footer>

  <script>
    (() => {
      const element = (identifier) => document.getElementById(identifier);
      const scene = element('scene');
      const playButton = element('play-button');
      const speedButtons = [...document.querySelectorAll('[data-speed]')];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const parts = Object.fromEntries([
        'bicycle', 'pelican', 'rear-spokes', 'front-spokes', 'rear-leg', 'front-leg',
        'rear-foot', 'front-foot', 'crank', 'road-marks', 'ground-details', 'far-clouds',
        'near-clouds', 'distant-birds', 'sea-lines', 'wind-lines', 'basket-flowers',
        'scarf-tail', 'scarf-tail-light', 'bike-shadow', 'forest-trees'
      ].map((identifier) => [identifier, element(identifier)]));
      const scenery = [
        { key: 'coast', name: '海岸漫游', caption: '海风轻轻，心也轻轻。', description: '沿着有帆船与灯塔的海岸骑行' },
        { key: 'forest', name: '林间小径', caption: '穿过树影，收集一点绿意。', description: '沿着松树林中的小径骑行' },
        { key: 'sunset', name: '落日追风', caption: '把今天，骑进温柔的晚霞。', description: '沿着落日映照的金色海岸骑行' }
      ];
      let playing = !reducedMotion.matches;
      let speed = 1;
      let elapsed = 0;
      let previousTime = null;
      let frame = null;
      let sceneIndex = 0;
      let audioContext = null;
      let bellTimeout = null;

      const transform = (identifier, value) => parts[identifier].setAttribute('transform', value);

      function renderLeg(side, angle, bounce) {
        const pedalX = 582 + Math.cos(angle) * 27;
        const pedalY = 451 + Math.sin(angle) * 27;
        const hipX = side === 'front' ? 563 : 552;
        const hipY = 327 + bounce;
        const ankleY = pedalY - 8;
        const deltaX = pedalX - hipX;
        const deltaY = ankleY - hipY;
        const reach = Math.hypot(deltaX, deltaY);
        const bend = Math.sqrt(Math.max(0, 80 ** 2 - (reach / 2) ** 2));
        const kneeX = (hipX + pedalX) / 2 + deltaY / reach * bend;
        const kneeY = (hipY + ankleY) / 2 - deltaX / reach * bend;
        parts[`${side}-leg`].setAttribute('d', `M${hipX} ${hipY}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)} ${pedalX.toFixed(2)} ${ankleY.toFixed(2)}`);
        transform(`${side}-foot`, `translate(${pedalX.toFixed(2)} ${pedalY.toFixed(2)})`);
        return { pedalX, pedalY };
      }

      function render() {
        const crankAngle = elapsed * 4.3 - .55;
        const featherBounce = Math.sin(crankAngle * 2) * 1.8;
        const bicycleBounce = Math.sin(elapsed * 5) * .75;
        const wheelAngle = elapsed * 155;
        const scarfFlutter = Math.sin(elapsed * 6.4) * 4;

        transform('bicycle', `translate(0 ${bicycleBounce.toFixed(2)})`);
        transform('pelican', `translate(0 ${featherBounce.toFixed(2)})`);
        transform('rear-spokes', `rotate(${wheelAngle.toFixed(2)})`);
        transform('front-spokes', `rotate(${wheelAngle.toFixed(2)})`);
        const frontPedal = renderLeg('front', crankAngle, featherBounce);
        const rearPedal = renderLeg('rear', crankAngle + Math.PI, featherBounce);
        parts.crank.setAttribute('d', `M${rearPedal.pedalX.toFixed(2)} ${rearPedal.pedalY.toFixed(2)}L${frontPedal.pedalX.toFixed(2)} ${frontPedal.pedalY.toFixed(2)}`);
        parts['road-marks'].setAttribute('patternTransform', `translate(${(-(elapsed * 118) % 155).toFixed(2)} 0)`);
        transform('ground-details', `translate(${(-(elapsed * 118) % 300).toFixed(2)} 0)`);
        transform('far-clouds', `translate(${(-(elapsed * 4) % 1200).toFixed(2)} 0)`);
        transform('near-clouds', `translate(${(-(elapsed * 7) % 1200).toFixed(2)} 0)`);
        transform('sea-lines', `translate(${(Math.sin(elapsed * .35) * 16).toFixed(2)} 0)`);
        transform('forest-trees', `translate(${(-(elapsed * 20) % 1400).toFixed(2)} 0)`);
        transform('distant-birds', `translate(${(Math.sin(elapsed * .22) * 14).toFixed(2)} ${(Math.sin(elapsed * .8) * 3).toFixed(2)})`);
        transform('wind-lines', `translate(${(Math.sin(elapsed * 1.5) * 8).toFixed(2)} 0)`);
        parts['wind-lines'].setAttribute('opacity', (.45 + Math.sin(elapsed * 2) * .2).toFixed(2));
        transform('basket-flowers', `rotate(${(Math.sin(elapsed * 3.5) * 2).toFixed(2)} 772 326)`);
        parts['scarf-tail'].setAttribute('d', `M596 234Q570 ${226 + scarfFlutter} 548 ${237 + scarfFlutter}L533 ${230 + scarfFlutter}l5-13Q565 ${218 + scarfFlutter} 599 227Z`);
        parts['scarf-tail-light'].setAttribute('d', `M598 236Q575 ${249 - scarfFlutter} 555 ${242 - scarfFlutter}l-11 8-3-14q31 ${-2 + scarfFlutter} 54-10Z`);
        parts['bike-shadow'].setAttribute('rx', (239 + bicycleBounce * 2).toFixed(2));
      }

      function animate(timestamp) {
        if (!playing || document.hidden) {
          frame = null;
          previousTime = null;
          return;
        }
        if (previousTime !== null) elapsed += Math.min((timestamp - previousTime) / 1000, .05) * speed;
        previousTime = timestamp;
        render();
        frame = requestAnimationFrame(animate);
      }

      function syncAnimation() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        previousTime = null;
        if (playing && !document.hidden) frame = requestAnimationFrame(animate);
      }

      function updatePlayback() {
        scene.classList.toggle('is-paused', !playing);
        playButton.setAttribute('aria-label', playing ? '暂停骑行' : '继续骑行');
        playButton.setAttribute('aria-pressed', String(!playing));
        element('play-icon').setAttribute('href', playing ? '#icon-pause' : '#icon-play');
        element('play-title').textContent = playing ? '暂停一下' : '继续兜风';
        element('play-caption').textContent = playing ? '让快乐，再骑一会儿' : '不着急，风景会等你';
        syncAnimation();
      }

      playButton.addEventListener('click', () => {
        playing = !playing;
        updatePlayback();
        element('announcement').textContent = playing ? '继续骑行' : '已暂停骑行';
      });

      speedButtons.forEach((button) => {
        button.addEventListener('click', () => {
          speed = Number(button.dataset.speed);
          speedButtons.forEach((option) => option.setAttribute('aria-pressed', String(option === button)));
          element('announcement').textContent = `骑行节奏：${button.textContent.trim()}${playing ? '' : '，当前已暂停'}`;
        });
      });

      element('scene-button').addEventListener('click', () => {
        sceneIndex = (sceneIndex + 1) % scenery.length;
        const currentScene = scenery[sceneIndex];
        scene.dataset.scene = currentScene.key;
        element('scene-name').textContent = currentScene.name;
        element('scene-caption').textContent = currentScene.caption;
        element('scene-edition').textContent = `DAYDREAM Nº 0${sceneIndex + 1}`;
        element('scene-button').setAttribute('aria-label', `换个风景，当前是${currentScene.name}`);
        element('art-description').textContent = `白色鹈鹕戴着橘红色围巾，骑着装有鲜花车篮的珊瑚色自行车，${currentScene.description}。双脚交替踩动踏板，车轮转动，围巾随风飘动。`;
        element('announcement').textContent = `已切换到${currentScene.name}。${currentScene.caption}`;
      });

      async function ringBell() {
        const AudioEngine = window.AudioContext || window.webkitAudioContext;
        if (!AudioEngine) return;
        try {
          audioContext ??= new AudioEngine();
          if (audioContext.state === 'suspended') await audioContext.resume();
          if (audioContext.state !== 'running') return;
          const startTime = audioContext.currentTime;
          [0, .17].forEach((delay) => {
            [1760, 2640].forEach((frequency, index) => {
              const oscillator = audioContext.createOscillator();
              const gain = audioContext.createGain();
              const noteStart = startTime + delay;
              oscillator.type = 'sine';
              oscillator.frequency.setValueAtTime(frequency, noteStart);
              gain.gain.setValueAtTime(0, noteStart);
              gain.gain.linearRampToValueAtTime(index === 0 ? .065 : .025, noteStart + .006);
              gain.gain.exponentialRampToValueAtTime(.0001, noteStart + .8);
              oscillator.connect(gain);
              gain.connect(audioContext.destination);
              oscillator.start(noteStart);
              oscillator.stop(noteStart + .85);
              oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
            });
          });
        } catch {
          audioContext = null;
        }
      }

      element('bell-button').addEventListener('click', () => {
        const hint = element('bell-hint');
        hint.textContent = '叮铃～ 把烦恼留在身后。';
        hint.classList.add('is-visible');
        clearTimeout(bellTimeout);
        bellTimeout = setTimeout(() => { hint.classList.remove('is-visible'); }, 2600);
        void ringBell();
      });

      document.addEventListener('visibilitychange', syncAnimation);
      reducedMotion.addEventListener('change', (event) => {
        if (event.matches) {
          playing = false;
          updatePlayback();
          element('announcement').textContent = '已根据系统减少动态效果设置暂停动画';
        }
      });

      render();
      updatePlayback();
    })();
  </script>
