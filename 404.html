<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 - AnyAIGC</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.ico">
<style>
:root{--ink:#241c1a;--muted:#6c615c;--canvas:#f8f5f2;--coral:#e45f45;--coral-dark:#bd432f;--line:#eaded8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
main{max-width:520px;text-align:center}
.code{font-size:64px;font-weight:800;color:var(--coral);margin:0;line-height:1}
h1{font-size:24px;margin:12px 0 8px}
p{color:var(--muted);margin:0 0 24px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:700;border:1px solid var(--line);color:var(--ink);background:#fff}
a.primary{background:var(--coral);border-color:var(--coral);color:#fff}
a.primary:hover{background:var(--coral-dark);border-color:var(--coral-dark)}
a:focus-visible{outline:3px solid rgba(228,95,69,.4);outline-offset:2px}
.en{margin-top:28px;font-size:14px}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>页面不存在</h1>
  <p>你访问的地址可能已更改或被移除。可以从模型专题找到想要的模型 API 价格与接入方法。</p>
  <div class="btns">
    <a class="primary" href="/zh/models/">模型专题</a>
    <a href="/">返回首页</a>
    <a href="/en/models/" hreflang="en" lang="en">Model Guides</a>
  </div>
  <p class="en" lang="en">Page not found. Browse the <a href="/en/models/" style="min-height:0;padding:0;border:0;background:none;text-decoration:underline;display:inline">model guides</a>.</p>
</main>
</body>
</html>
